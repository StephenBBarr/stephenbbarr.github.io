<section class="stack" aria-label="{{ariaLabel}}">
  <div class="about-layout">
    <div class="stack">
      <header class="about-heading">
        <h1>{{headline}}</h1>
        <p class="about-subtitle">{{subtitle}}</p>
      </header>
      {{paragraphs}}
    </div>
    <figure class="about-portrait"><img src="{{portraitSource}}" alt="{{portraitDescription}}" width="{{portraitWidth}}" height="{{portraitHeight}}" decoding="async"></figure>
  </div>
  {{readingControls}}
</section>
