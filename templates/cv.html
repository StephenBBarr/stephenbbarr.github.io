<article class="stack stack--spacious" aria-label="{{ariaLabel}}">
  <header class="stack">
    {{heading}}<aside class="notice stack" aria-labelledby="cv-notice-title">
      <p><strong id="cv-notice-title">{{noticeLabel}}.</strong> {{noticePrefix}}{{noticeLink}}{{noticeSuffix}}</p>
      {{pdfLink}}
    </aside>
    <div class="cv-identity">
      <div><p class="document-title">{{name}}</p>{{identityTitle}}</div>
      <address class="meta"><span>{{location}}</span>{{linkedIn}}</address>
    </div>
  </header>
  {{profile}}
  {{experience}}
  {{projects}}
  {{technology}}
  {{education}}
  {{pdfLink}}
  {{readingControls}}
</article>
